name: Test Build

on:
  pull_request:
    branches:
      - main

jobs:
  test-build:
    name: Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      - name: Build website
        run: npm run build

      - name: Test broken links
        run: |
          npm run serve &
          sleep 5
          npx wait-on http://localhost:3000
          # Add broken link checker here if needed
          # npx broken-link-checker http://localhost:3000
